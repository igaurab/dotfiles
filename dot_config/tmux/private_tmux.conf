# Minimal tmux configuration
# Based on custom settings with Gruvbox theme

# ============================================================================
# General Settings
# ============================================================================

set -g default-terminal "screen-256color"
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Set prefix
set -g prefix C-b
bind C-b send-prefix

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Automatically rename windows
setw -g automatic-rename on
set -g set-titles on

# Status bar position
set -g status-position top

# Disable bells
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ============================================================================
# Key Bindings
# ============================================================================

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes
bind \\ split-window -h -c "#{pane_current_path}"
bind Enter split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Option+hjkl pane navigation (macOS)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Option+Shift+hjkl pane resize
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Option+number for window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-n next-window
bind -n M-p previous-window

# Quick actions
bind x kill-pane
bind X kill-window

# Last session
bind L switch-client -l

# Copy mode bindings
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Session switcher with fzf
bind s display-popup -E -w 40% -h 40% "tmux list-sessions -F '#S' | fzf --reverse --prompt='  ' --pointer='▌' --color=bg:#282828,bg+:#3c3836,fg:#a89984,fg+:#ebdbb2,hl:#d79921,hl+:#d79921,pointer:#d79921,prompt:#d79921,info:#665c54 | xargs -I{} tmux switch-client -t {}"

# Fuzzy project sessionizer (prefix + f)
bind f display-popup -E -w 50% -h 50% "~/.config/tmux/sessionizer.sh"

# Workspace manager (prefix + w)
bind w display-popup -E -w 60% -h 60% "~/.config/tmux/workspace-manager.sh"

# ============================================================================
# Mouse Scrolling
# ============================================================================

unbind -n MouseDrag1Pane
unbind -n WheelUpPane
unbind -n WheelDownPane
bind -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    "send -M" \
    "copy-mode -e; send -M"

# ============================================================================
# Gruvbox Theme
# ============================================================================

# Colors
tmux_bg0="#282828"
tmux_bg1="#3c3836"
tmux_gray="#a89984"
tmux_blue="#458588"
tmux_yellow="#d79921"
tmux_fg="#ebdbb2"
tmux_purple="#b16286"
tmux_green="#98971a"
tmux_red="#cc241d"
tmux_dark_gray="#665c54"

# Status bar style
set -g status-style "fg=$tmux_gray,bg=default"
set -g status-left " #S │ "
set -g status-left-style "fg=$tmux_yellow,bold"
set -g status-right " #{battery_status} #{battery_percentage} | %I:%M %p "
set -g status-right-style "fg=$tmux_gray"

# Window status
setw -g window-status-format " #I #W "
setw -g window-status-style "fg=$tmux_dark_gray"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "fg=$tmux_fg,bold"
setw -g window-status-activity-style "underscore"
setw -g window-status-bell-style "fg=$tmux_yellow,blink,bold"
setw -g window-status-last-style "fg=$tmux_gray"

# Pane borders
set -g pane-border-style "fg=$tmux_bg1"
set -g pane-active-border-style "fg=$tmux_blue"

# Message style
set -g message-style "fg=$tmux_bg0,bg=$tmux_yellow,bold"
set -g message-command-style "fg=$tmux_yellow,bg=$tmux_bg0,bold"

# Mode style (copy mode, etc.)
setw -g mode-style "fg=$tmux_bg0,bg=$tmux_yellow,bold"

# Pane indicator
set -g display-panes-colour "$tmux_blue"
set -g display-panes-active-colour "$tmux_blue"

# Clock
set -g clock-mode-colour "$tmux_blue"
set -g clock-mode-style 24

# ============================================================================
# TPM Plugin Manager
# ============================================================================

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @continuum-restore 'off'

# TPM keybindings:
#   prefix + I     - Install plugins
#   prefix + U     - Update plugins
#   prefix + alt+u - Uninstall plugins

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
